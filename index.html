<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>Mi Rutina</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial;background:#f4f4f6;color:#171717}header{position:sticky;top:0;background:#f4f4f6ee;padding:15px;border-bottom:1px solid #ddd;z-index:2}h1{margin:0 0 10px}.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:10px;border:0;border-radius:10px;font-weight:bold}.active{background:#111;color:white}main{max-width:700px;margin:auto;padding:12px 12px 100px}.card,.history{background:white;border-radius:16px;padding:15px;margin:11px 0;box-shadow:0 1px 5px #0001}.name{font-weight:bold}.rx,.muted{color:#666;font-size:13px}.prev{background:#eee;padding:8px;border-radius:9px;margin-top:8px;font-size:12px}.set{display:grid;grid-template-columns:55px 1fr 1fr;gap:8px;margin-top:9px;align-items:center}input{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font-size:16px;box-sizing:border-box}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;display:flex;gap:8px;border-top:1px solid #ddd}footer button{flex:1;padding:13px;border:0;border-radius:12px;font-weight:bold}.save{background:#111;color:white}.backup{background:#ddd}.histrow{padding:8px 0;border-bottom:1px solid #eee;font-size:12px}.histrow:last-child{border:0}
</style></head><body>
<header><h1>Mi rutina</h1><div class="tabs"><button class="active">Día 1</button><button>Día 2</button><button>Día 3</button></div></header>
<main><div id="routine"></div><h2>📈 Historial</h2><div id="history"></div></main>
<footer><button class="backup" id="backup">💾 Respaldo</button><button class="save" id="save">✓ Guardar sesión</button></footer>
<script>
const D=[
["Cuádriceps + Pecho",[["Sentadilla péndulo o hack",3,6,8],["Press inclinado máquina o Smith",3,6,8],["Remo T en máquina",3,6,8],["Curl femoral sentado o acostado",2,10,12],["Elevaciones laterales en polea (unilateral)",3,10,12],["Extensiones de tríceps con soga",2,8,12],["Curl bayesian",2,10,12],["Abdominales en máquina o polea",2,12,15]]],
["Cadena posterior + Espalda",[["Peso muerto rumano con barra",3,6,8],["Jalón al pecho agarre neutro",3,6,8],["Prensa",2,8,10],["Press militar máquina o Smith",2,6,8],["Remo unilateral máquina o polea",2,8,10],["Hombro posterior en Peck Deck o poleas",2,10,12],["Curl con barra en polea",2,10,12],["Extensiones de tríceps trasnuca unilateral",2,10,12]]],
["Torso + Piernas",[["Sentadilla péndulo o hack",3,6,8],["Press inclinado con mancuernas",3,6,8],["Jalón al pecho agarre neutro",3,6,8],["Extensiones de cadera en banco lumbar",2,10,12],["Aperturas de pecho en máquina Peck Deck o polea",2,10,12],["Elevaciones laterales con mancuernas",3,10,12],["Curl banco Scott máquina o unilateral con mancuernas",2,10,12],["Press francés",2,8,10],["Rueda abdominal",2,12,15]]]
];
const K="mi_rutina_v2", S=JSON.parse(localStorage.getItem(K)||'{"current":{},"history":[]}');let day=0;
const key=(e,s)=>day+"-"+e+"-"+s, saveLocal=()=>localStorage.setItem(K,JSON.stringify(S));
function last(e){for(const x of S.history)if(x.day==day&&x.values[`${day}-${e}-0`])return x.values;return null}
function render(){
 document.querySelectorAll(".tabs button").forEach((b,i)=>b.className=i==day?"active":"");
 let h=`<p class="muted">Día ${day+1} · ${D[day][0]}</p>`;
 D[day][1].forEach((e,i)=>{let p=last(i);h+=`<div class="card"><div class="name">${e[0]}</div><div class="rx">${e[1]} × ${e[2]}–${e[3]} reps</div>`;
 if(p){let a=[];for(let s=0;s<e[1];s++){let v=p[`${day}-${i}-${s}`];if(v&&(v.w||v.r))a.push(`S${s+1}: ${v.w||0} kg × ${v.r||0}`)}if(a.length)h+=`<div class="prev">Última vez: ${a.join(" · ")}</div>`}
 for(let s=0;s<e[1];s++){let v=S.current[key(i,s)]||{};h+=`<div class="set"><span>Serie ${s+1}</span><input data-k="${key(i,s)}" data-f="w" inputmode="decimal" placeholder="Peso kg" value="${v.w||""}"><input data-k="${key(i,s)}" data-f="r" inputmode="numeric" placeholder="Reps" value="${v.r||""}"></div>`}h+="</div>"});
 document.getElementById("routine").innerHTML=h;
 document.querySelectorAll("input").forEach(x=>x.oninput=()=>{S.current[x.dataset.k]=S.current[x.dataset.k]||{};S.current[x.dataset.k][x.dataset.f]=x.value;saveLocal()});hist()
}
function hist(){
 let h="";S.history.forEach((x,n)=>{let rows=[];D[x.day][1].forEach((e,i)=>{let a=[];for(let s=0;s<e[1];s++){let v=x.values[`${x.day}-${i}-${s}`];if(v&&(v.w||v.r))a.push(`S${s+1}: ${v.w||0} kg × ${v.r||0}`)}if(a.length)rows.push(`<b>${e[0]}</b><br>${a.join(" · ")}`)});h+=`<div class="history"><b>Día ${x.day+1} · ${D[x.day][0]}</b><div class="muted">${new Date(x.date).toLocaleString("es-AR",{dateStyle:"medium",timeStyle:"short"})}</div>${rows.map(r=>`<div class="histrow">${r}</div>`).join("")}</div>`});document.getElementById("history").innerHTML=h||'<p class="muted">Todavía no hay sesiones guardadas.</p>'
}
document.querySelectorAll(".tabs button").forEach((b,i)=>b.onclick=()=>{day=i;render()});
document.getElementById("save").onclick=()=>{let ok=Object.keys(S.current).length;if(!ok)return alert("Cargá algún peso o repetición.");S.history.unshift({date:new Date().toISOString(),day,values:{...S.current}});S.history=S.history.slice(0,200);saveLocal();alert("Sesión guardada. La próxima vez podrás comparar con esta.");render()};
document.getElementById("backup").onclick=()=>{let b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="mi-rutina-respaldo.json";a.click()};
render();
</script></body></html>
